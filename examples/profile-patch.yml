# Example profile overlay for local testing with a fixed spend value.
#
# Copy the entry into your profile's `cordis.patch.yml` (for a profile named
# `web`: $DSH_HOME/profiles/web/cordis.patch.yml), or pass it as a launcher
# overlay:
#
#   dsh --profile web --patch E:/workspace/dsh-spend-wallpaper/examples/profile-patch.yml
#
# `source: manual` does not query a wallet; `manualSpend` is the reported
# spend for the rolling window, so you can walk through the five tiers without
# waiting for real usage.
- id: spend-wallpaper
  config:
    enabled: true
    source: manual
    manualSpend: "0.40"
    mode: frame
    media: auto
    thresholds: ["0", "0.05", "0.30", "1.50", "6.00"]
    scrim: 0.28
    dim: 0.08
    inset: 16
    radius: 16
